<title>Cubaty</title>
<style>
:root{--bg:#F4F5F9;--sf:#fff;--sf2:#E9EBF3;--tx:#12121A;--mu:#6B6F85;--ln:#DDE0EC;--pr:#000;--prt:#fff;--fl:#FF8A4C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media all{:root:not([data-theme="light"]){--bg:#000;--sf:#0E0E11;--sf2:#1B1B20;--tx:#F3F3F6;--mu:#8B8B96;--ln:#23232A;--pr:#fff;--prt:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--sf:#0E0E11;--sf2:#1B1B20;--tx:#F3F3F6;--mu:#8B8B96;--ln:#23232A;--pr:#fff;--prt:#000;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--tx);font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:8px 16px 24px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}h2{font-size:17px;margin:22px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{opacity:.4}
header{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}header b{flex:1;font-size:22px;font-weight:800}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.c{text-align:center}
.btn{background:var(--pr);color:var(--prt);border-radius:12px;padding:10px 16px;font-weight:700}.btn.g{background:var(--sf2);color:var(--tx)}.btn.sm{padding:7px 12px;font-size:13px}
input,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 13px}
textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.av{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#000}
.bar{height:10px;border-radius:99px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
nav{display:flex;background:var(--bg);border-top:1px solid var(--ln)}nav button{flex:1;padding:12px 0;font-size:13px;color:var(--mu);font-weight:500}nav button.on{color:var(--tx);font-weight:800}
.dk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-radius:14px;background:var(--sf2);border-left:6px solid var(--c);font-weight:700;width:100%;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{padding:8px 12px;border-radius:99px;background:var(--sf2);border:1.5px solid var(--c);font-size:14px;text-align:left}
.big{font-size:58px;font-weight:800;text-align:center;line-height:1}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px}.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--mu)}.seg button.on{background:var(--pr);color:var(--prt)}
.x{color:var(--mu);font-size:20px;padding:0 6px}.back{padding:10px 0;font-weight:700;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:14px}.cal .h{aspect-ratio:auto;color:var(--mu);font-size:12px}.cal .ok{background:#22C55E;color:#04210f;font-weight:800;cursor:pointer}.cal .td{outline:2px solid var(--tx);outline-offset:-2px}.cal .sl{outline:3px solid var(--pr)}.ib{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ln)}
.dk{border-left:0;padding-left:20px;background:var(--g) left/6px 100% no-repeat,var(--sf2)}
.an{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}.sn{position:relative;height:90px;width:160px;overflow:hidden;font:800 80px/90px system-ui;color:var(--fl)}.sn span{position:absolute;inset:0}.sn .o{animation:out .5s 1s forwards}.sn .n{animation:inn .5s 1s both}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes glow{to{filter:drop-shadow(0 0 22px var(--g))}}@keyframes out{to{transform:translateY(-100%);opacity:0}}@keyframes inn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.rk{position:relative;width:200px;height:190px;display:grid;place-items:center}.rb{position:absolute;inset:0;display:grid;place-items:center}.rb.o{animation:rout .6s .9s forwards}.rb.n{animation:rin .9s 1s cubic-bezier(.2,1.5,.4,1) both,rglow 1.6s 1.9s ease-in-out infinite alternate}.rk i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c);opacity:0;animation:burst .9s 1s ease-out forwards}.an .t{opacity:0;animation:fin .5s 1.6s forwards}
@keyframes rout{to{transform:scale(.4) rotate(-20deg);opacity:0}}@keyframes rin{from{transform:scale(0) rotate(25deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes rglow{to{filter:drop-shadow(0 0 24px var(--c))}}@keyframes burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-120px) scale(.2);opacity:0}}@keyframes fin{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.an svg,.sn span,.rb,.rk i,.an .t{animation:none}.sn .o,.rb.o,.rk i{display:none}.an .t{opacity:1}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rbw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".25" stop-color="#facc15"/><stop offset=".5" stop-color="#22c55e"/><stop offset=".75" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg><div id="app"><header id="top" hidden></header><main id="main"></main><nav id="nav" hidden></nav></div>
<script>
const $=s=>document.querySelector(s),DAY=864e5;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#FFC83D','#B4376B','#C77B4A','#54A0FF','#1DD1A1','#FF6B6B','#B15CFF','#FF9F43','#00D2D3','#A3E635'];
const TN=[['Hierro','#9AA1AD'],['Bronce','#C77B4A'],['Plata','#C9D6E4'],['Oro','#F2B632'],['Rubí','#E5243B'],['Esmeralda','#1FBF73'],['Diamante','#59B7FF'],['Campeón','#A24BFF'],['Borracho','#FFD84D']],RK=[];for(let r=0;r<=24;r++){const at=Math.round(300*Math.pow(r/24,1.5));RK.push(r<24?[TN[Math.floor(r/3)][0]+' '+['I','II','III'][r%3],at,TN[Math.floor(r/3)][1]]:['Borracho',at,TN[8][1]])}
const DEF=()=>[['Cerveza',1],['Vino',1],['Ron',2],['Whisky',2],['Vodka',2],['Tequila',2],['Ginebra',2],['Licor',2],['Mezcla',3],['A palo seco',3],['Chupito',1],['Tinto',1]].map((x,i)=>({id:'c'+i,name:x[0],p:x[1],c:CM[x[0]]||PAL[i%10],subs:[]})).sort((a,b)=>a.p-b.p);
let S=null,tab='drink',sub=null,ob={name:'',color:PAL[0]},confirmWipe=false,fcode='',ttl='';
try{S=JSON.parse(localStorage.getItem('beb:data'))}catch(e){}
const CM={'Whisky':'#FF9F43','Vodka':'#FFFFFF','Tequila':'#FFFFFF','Licor':'#FFFFFF','Mezcla':'rb','Chupito':'#FF9EC4','A palo seco':'#000000','Tinto':'#D81B9A'};
if(S&&Array.isArray(S.cats)){[['Licor',2],['Mezcla',3],['A palo seco',3],['Chupito',1],['Tinto',1]].forEach((x,i)=>{if(!S.cats.some(c=>c.name===x[0]))S.cats.push({id:'c'+(7+i),name:x[0],p:x[1],c:PAL[(7+i)%10],subs:[]})});S.cats.forEach(c=>{if(CM[c.name])c.c=CM[c.name]});S.cats.sort((a,b)=>a.p-b.p)}
const save=()=>{try{localStorage.setItem('beb:data',JSON.stringify(S))}catch(e){toast('No se pudo guardar')}};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const dn=t=>{const x=new Date(t);return Math.floor(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())/DAY)};
const items=()=>S.sessions.flatMap(s=>s.items).concat(S.run?S.run.items:[]);
const total=()=>items().reduce((a,i)=>a+i.p,0);
const week=()=>items().filter(i=>i.at>Date.now()-7*DAY).reduce((a,i)=>a+i.p,0);
const ri=p=>{let r=0;RK.forEach((x,i)=>{if(p>=x[1])r=i});return r};
function stk(){const t=dn(Date.now()),ds=[...new Set(items().map(i=>dn(i.at)))].sort((a,b)=>a-b);
 if(!S.lose)return{cur:ds.length,best:ds.length,days:ds.length};
 let best=0,r=0,pv=null;ds.forEach(d=>{r=pv!==null&&d-pv<=30?r+1:1;pv=d;if(r>best)best=r});
 return{cur:pv!==null&&t-pv<=30?r:0,best,days:ds.length}}
const av=(n,c,z)=>`<div class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.42)}px;background:${c}">${esc((n||'?').trim()[0]||'?').toUpperCase()}</div>`;
const ICI=[5,0,6,1,2,3,7,8,9];
const badge=(i,z)=>{const t=Math.floor(i/3),f=t===8?'url(#rbw)':RK[i][2];return `<svg width="${z}" height="${Math.round(z*1.1)}" viewBox="0 0 56 62" aria-hidden="true" style="flex:none"><path d="M28 2l22 8v20c0 14-10 24-22 30C16 54 6 44 6 30V10z" fill="${f}" fill-opacity=".2" stroke="${f}" stroke-width="3"/><g transform="translate(9 6) scale(.8)" fill="${f}" stroke="${f}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${ICO[ICI[t]]}</g><rect x="13" y="45" width="30" height="14" rx="7" fill="${f}"/><text x="28" y="55.5" text-anchor="middle" font-size="11" font-weight="800" fill="#000">${i<24?['I','II','III'][i%3]:'★'}</text></svg>`};
const fmtD=t=>new Date(t).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' '+new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const FL='M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z';

function add(cid,sid,nmv){if(!S.run)return;const c=S.cats.find(x=>x.id===cid);if(!c)return;const s=sid&&c.subs.find(x=>x.id===sid),b=ri(total()),kb=stk().cur;
 S.run.items.push({cat:cid,sub:sid||null,n:s?s.name:(nmv||c.name),cn:c.name,p:c.p,at:Date.now()});save();const a=ri(total()),ka=stk().cur;nm=null;render()}
function summary(its){const m={};its.forEach(i=>{m[i.n]=m[i.n]||{n:i.n,k:0,p:0};m[i.n].k++;m[i.n].p+=i.p});return Object.values(m).map(x=>`${esc(x.n)} ×${x.k}`).join(' · ')}

function vOnboard(){return `<h1 style="margin-top:24px">Crea tu perfil</h1><div class="c" style="margin:18px 0"><button data-a="obc">${av(ob.name||'?',ob.color,100)}</button><div class="mu">Toca para cambiar el color</div></div><label class="lbl" for="obn">Nombre</label><input id="obn" maxlength="30" value="${esc(ob.name)}"><label class="lbl" for="obb">Descripción (opcional)</label><input id="obb" maxlength="80" placeholder="Ej. Rey de la barra" value="${esc(ob.bio||'')}"><button class="btn" id="obg" data-a="obgo" style="width:100%;margin-top:20px;padding:14px" ${ob.name.trim()?'':'disabled'}>Crear perfil</button>`}

function manage(){return `<h2>Cubatas</h2><div class="card"><select id="mc">${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)} (+${c.p})</option>`).join('')}</select><input id="mn" maxlength="40" placeholder="Nombre (ej. Cuba libre)" style="margin-top:8px"><button class="btn" data-a="addsub" style="width:100%;margin-top:10px">Añadir cubata</button></div>`+S.cats.filter(c=>c.subs.length).map(c=>`<div class="card" style="margin-top:8px;border-left:6px solid ${sc(c.c)}"><div class="b">${esc(c.name)}</div>${c.subs.map(s=>`<div class="row" style="margin-top:6px"><div class="grow">${esc(s.name)}</div><button class="x" data-a="delsub" data-v="${c.id}|${s.id}" aria-label="Borrar">×</button></div>`).join('')}</div>`).join('')}
function vDrink(){
 if(!S.run)return `<h1>Beber</h1><div class="card c"><div class="b" style="margin-bottom:10px">¿Salimos?</div><button class="btn" data-a="start" style="width:100%;padding:14px">Empezar sesión</button></div>`+manage();
 const its=S.run.items,pts=its.reduce((a,i)=>a+i.p,0);
 return `<h1>Beber</h1><div class="card"><div class="mu c">Sesión en curso</div><div class="big">${pts}</div><div class="mu c">puntos · ${its.length} bebidas</div></div><div class="list" style="margin-top:12px">${S.cats.map(c=>{const k=its.filter(i=>i.cat===c.id).length;return `<div><button class="dk" style="--g:${bgi(c.c)}" data-a="add" data-v="${c.id}"><span>${esc(c.name)}${k?' ×'+k:''}</span><span>+${c.p}</span></button>${nm===c.id?`<div class="row" style="margin-top:8px"><input id="dn" maxlength="40" placeholder="Nombre del cubata (obligatorio)"><button class="btn sm" data-a="addn" data-v="${c.id}">Guardar</button></div>`:''}${c.subs.length?`<div class="chips">${c.subs.map(s=>`<button class="chip" style="--c:${sc(c.c)}" data-a="adds" data-v="${c.id}|${s.id}"><b>${esc(s.name)}</b></button>`).join('')}</div>`:''}</div>`}).join('')}</div>
 <div class="card" style="margin-top:12px"><input id="ttl" maxlength="60" placeholder="Nombre de la sesión (obligatorio)" value="${esc(ttl)}"><div class="row" style="margin-top:10px">${S.run.ph?`<img src="${S.run.ph}" alt="" style="width:56px;height:56px;border-radius:10px;object-fit:cover">`:''}<label class="btn g sm" style="cursor:pointer">${S.run.ph?'Cambiar foto':'Añadir foto (opcional)'}<input type="file" id="rph" accept="image/*" hidden></label>${S.run.ph?'<button class="btn g sm" data-a="rph0">Quitar</button>':''}</div><div class="row" style="margin-top:10px"><button class="btn g grow" data-a="undo" ${its.length?'':'disabled'}>Deshacer</button><button class="btn grow" data-a="finish">Terminar</button></div><button style="width:100%;margin-top:8px;padding:8px;color:#ff6b6b;font-weight:700" data-a="discard">Descartar sesión</button></div>`}

function vRanks(){const t=total(),i=ri(t),r=RK[i],n=RK[i+1],pc=n?(t-r[1])/(n[1]-r[1])*100:100;
 const bd=[{n:S.name+' (tú)',w:week(),me:1},...S.friends.map(f=>({n:f.n,w:f.w}))].sort((a,b)=>b.w-a.w);
 const per={};items().forEach(x=>{per[x.cn]=(per[x.cn]||0)+x.p});
 return `<h1>Rangos</h1><button class="card row" data-a="stats" style="width:100%;margin-bottom:12px"><b class="grow" style="text-align:left">Estadísticas</b><span class="mu">›</span></button><div class="card" style="--c:${r[2]}"><div class="row">${liv(72,r[2])}<div class="grow"><div class="mu">Tu rango</div><div style="font-size:28px;font-weight:800;color:${r[2]}">${r[0]}</div><div class="mu">${t} puntos</div></div></div><div class="bar" style="margin:14px 0 8px"><i style="width:${pc}%"></i></div><div class="mu">${n?`Te faltan ${n[1]-t} puntos para ${n[0]}`:'Has llegado al rango máximo'}</div></div>
 ${foldBtn('dr','Rangos por cubata')}${S.fold_dr===true?'':drinkRanks()}
 ${foldBtn('al','Todos los rangos')}<div class="list"${S.fold_al===true?' style="display:none"':''}>${RK.map((x,k)=>({x,k})).reverse().map(({x,k})=>`<div class="card row" style="padding:8px 14px;${k>i?'opacity:.4':''}${k===i?';border-color:var(--pr)':''}">${badge(k,40)}<span class="grow b">${x[0]}</span><span class="mu">desde ${x[1]} pts</span></div>`).join('')}</div>
 ${foldBtn('wk','Esta semana con tus amigos')}<div class="list"${S.fold_wk===true?' style="display:none"':''}>${bd.map((u,k)=>`<div class="card row" style="padding:10px 14px"><b style="width:22px">${k+1}</b><span class="grow ${u.me?'b':''}">${esc(u.n)}</span><b>${u.w} pts</b></div>`).join('')}</div>`}

const code=()=>'BEBE:'+btoa(unescape(encodeURIComponent(JSON.stringify(shareObj(false)))));
function vFriends(){return `<h1>Amigos</h1><div class="seg" style="margin-bottom:12px"><button data-a="fv" data-v="foryou" class="${fv==='foryou'?'on':''}">Para ti</button><button data-a="fv" data-v="people" class="${fv==='people'?'on':''}">Amigos</button></div>${fv==='foryou'?feed():vPeople()}`}
function vPeople(){return `<div class="card"><div class="b">Mi código</div><p class="mu" style="margin:4px 0 8px">Envíaselo a un amigo. Verá tus puntos tal como están ahora; para actualizarlos, envía un código nuevo.</p><textarea rows="3" readonly id="mycode">${esc(code())}</textarea><button class="btn g" data-a="copy" style="width:100%;margin-top:8px">Copiar código</button><button class="btn g" data-a="sharefile" style="width:100%;margin-top:8px">Compartir archivo con fotos</button></div>
 <div class="card" style="margin-top:12px"><div class="b" style="margin-bottom:8px">Añadir amigo</div><textarea id="fc" rows="3" placeholder="Pega aquí el código de tu amigo">${esc(fcode)}</textarea><button class="btn" data-a="addf" style="width:100%;margin-top:8px">Añadir</button><label class="btn g" style="cursor:pointer;display:block;text-align:center;margin-top:8px">Importar archivo con fotos<input type="file" id="fimp" accept=".json,application/json" hidden></label></div>
 <h2>Tus amigos</h2>${S.friends.length?`<div class="list">${S.friends.map(f=>{const i=ri(f.t);return `<div class="card row">${avp(f.n,f.c,44,f.ph)}<div class="grow"><div class="b">${esc(f.n)}</div>${f.b?`<div>${esc(f.b)}</div>`:''}<div class="mu">${RK[i][0]} · ${f.t} pts · racha ${f.s}</div></div><button class="x" data-a="rmf" data-v="${f.p}" aria-label="Quitar">×</button></div>`}).join('')}</div>`:'<p class="mu">Aún no tienes amigos añadidos.</p>'}`}

function vMe(){const t=total(),i=ri(t),k=stk();
 return `<h1>Perfil</h1><div class="card c"><div style="display:flex;justify-content:center">${avp(S.name,S.color,96,S.ph)}</div><div class="b" style="font-size:22px;margin-top:8px">${esc(S.name)}</div>${S.bio?`<div>${esc(S.bio)}</div>`:''}<div class="mu row" style="justify-content:center;gap:8px">${badge(i,30)} ${RK[i][0]} · ${t} pts <button class="pill" data-a="streak" aria-label="Racha" style="padding:3px 10px;color:${k.cur?FC(k.cur).replace('url(#rbw)','#facc15'):'var(--mu)'}"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:${k.cur?FC(k.cur):'var(--mu)'}"><path d="${FL}"/></svg>${k.cur}</button></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px"><div><b style="font-size:22px">${S.sessions.length}</b><div class="mu">Sesiones</div></div><div><b style="font-size:22px">${S.friends.filter(f=>(f.fo||[]).includes(S.pid)).length}</b><div class="mu">Seguidores</div></div><div><b style="font-size:22px">${S.friends.length}</b><div class="mu">Siguiendo</div></div></div></div>
 <h2>Sesiones de bebidas</h2>${S.sessions.length?`<div class="list">${[...S.sessions].reverse().map(s=>`<div class="card"><div class="row"><div class="grow"><div class="b">${esc(s.title)}</div><div class="mu">${fmtD(s.start)}</div></div><b>${s.total} pts</b></div><div class="mu" style="margin-top:6px">${summary(s.items)}</div>${s.ph?`<img src="${s.ph}" alt="" style="width:100%;border-radius:12px;margin-top:8px">`:''}</div>`).join('')}</div>`:'<p class="mu">Todavía no hay sesiones.</p>'}
 `}
function vSettings(){return backBtn()+`<h1>Ajustes</h1><div class="card c"><div style="display:flex;justify-content:center">${avp(S.name,S.color,96,S.ph)}</div><div class="row" style="justify-content:center;margin-top:10px"><label class="btn g sm" style="cursor:pointer">${S.ph?'Cambiar foto':'Subir foto'}<input type="file" id="sph" accept="image/*" hidden></label>${S.ph?'<button class="btn g sm" data-a="srm">Quitar foto</button>':''}</div></div><label class="lbl" for="sn" style="margin-top:0">Nombre</label><input id="sn" maxlength="30" value="${esc(S.name)}"><label class="lbl" for="sb">Descripción (opcional)</label><input id="sb" maxlength="80" value="${esc(S.bio||'')}"><span class="lbl">Tema</span><div class="seg">${[['dark','Oscuro'],['light','Claro']].map(o=>`<button data-a="theme" data-v="${o[0]}" class="${(S.theme==='light'?'light':'dark')===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>
 
 ${confirmWipe?`<div class="card" style="margin-top:16px"><div class="b">¿Borrar todos tus datos?</div><p class="mu">No se puede deshacer.</p><button class="btn" style="width:100%;background:#ff5a5a;color:#000" data-a="wipe2">Sí, borrar</button><button class="btn g" style="width:100%;margin-top:8px" data-a="wipe0">Cancelar</button></div>`:`<button class="btn" data-a="wipe1" style="width:100%;margin-top:18px;background:#ff5a5a;color:#000">Borrar todos mis datos</button>`}`}

let calOff=0,calSel=null,anim=null,AQ=[],fv='foryou',stP='week',stO=0,stSub=null,nm=null;
const RBG='linear-gradient(180deg,#ef4444,#facc15,#22c55e,#3b82f6,#a855f7)',bg=c=>c==='rb'?RBG:c,bgi=c=>c==='rb'?RBG:`linear-gradient(${c},${c})`,sc=c=>c==='rb'?'#B15CFF':c,svc=c=>c==='rb'?'url(#rbw)':c;
const foldBtn=(k,t)=>{const open=S['fold_'+k]!==true;return `<button class="row" data-a="fold" data-v="${k}" aria-expanded="${open}" style="width:100%;margin:22px 0 10px;text-align:left"><h2 class="grow" style="margin:0">${t}</h2><span class="mu" style="font-size:18px">${open?'▾':'▸'}</span></button>`};
const hf=h=>(Math.round(h*10)/10).toString().replace('.',',');
const liv=(z,c)=>`<svg width="${z}" height="${Math.round(z*.85)}" viewBox="0 0 48 41" aria-hidden="true" style="flex:none"><path d="M3 16C3 9 10 5 21 5c10 0 20 4 25 11 1 3 0 6-3 7-5 1-9 1-13 4-3 4-7 9-14 9C8 36 3 30 3 16z" fill="${c}" fill-opacity=".85" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M24 9c-3 6-1 13 4 17M34 11c-1 3 0 7 3 9" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/></svg>`;
function drinkRanks(){const m={};items().forEach(x=>{const c=S.cats.find(z=>z.id===x.cat);(m[x.cn]=m[x.cn]||{n:x.cn,p:0,k:0,c:c?c.c:'#888'});m[x.cn].p+=x.p;m[x.cn].k++});const L=Object.values(m).sort((a,b)=>b.p-a.p);
 return L.length?`<div class="list">${L.map(x=>{const i=ri(x.p),r=RK[i],nx=RK[i+1],pc=nx?(x.p-r[1])/(nx[1]-r[1])*100:100;return `<div class="card" style="--c:${r[2]}"><div class="row">${badge(i,44)}<div class="grow"><div class="b"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${bg(x.c)};margin-right:6px"></span>${esc(x.n)}</div><div class="mu">${r[0]} · ${x.p} pts · ×${x.k}</div></div></div><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div></div>`}).join('')}</div>`:'<p class="mu">Bebe algo para ver el rango de cada cubata.</p>'}

 h.hidden=n.hidden=false;const k=stk();h.innerHTML=`<b>Cubaty<small style="font-size:11px;font-weight:500;color:var(--mu);margin-left:6px">by Wonte</small></b><button class="pill" data-a="streak" aria-label="Racha" style="color:${k.cur?FC(k.cur).replace('url(#rbw)','#facc15'):'var(--mu)'}"><svg width="20" height="20" viewBox="0 0 24 24" style="fill:${k.cur?FC(k.cur):'var(--mu)'}"><path d="${FL}"/></svg>${k.cur}</button><button class="ib" data-a="settings" aria-label="Ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>`;
 n.innerHTML=[['friends','Amigos'],['ranks','Rangos'],['drink','Beber'],['me','Perfil']].map(o=>`<button data-a="tab" data-v="${o[0]}" class="${tab===o[0]&&!sub?'on':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${NI[o[0]]}</svg>${o[1]}</button>`).join('');
 m.innerHTML=sub?({streak:vStreak,settings:vSettings,stats:vStats})[sub]():({drink:vDrink,ranks:vRanks,friends:vFriends,me:vMe})[tab]();ovl()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='obc'){ob.name=$('#obn').value;ob.bio=$('#obb').value;ob.color=PAL[(PAL.indexOf(ob.color)+1)%PAL.length];render();return}
 if(a==='obgo'){const n=$('#obn').value.trim();if(!n)return;S={name:n,bio:($('#obb').value||'').trim().slice(0,80),color:ob.color,lose:false,theme:'dark',cats:DEF(),sessions:[],friends:[],run:null,pid:Math.random().toString(36).slice(2,10)+Date.now().toString(36)};save();render();return}
 if(!S)return;
 if(a==='tab'){tab=v;sub=null;confirmWipe=false;render();$('#main').scrollTop=0}
 else if(a==='streak'){calOff=0;calSel=null;sub='streak';render();$('#main').scrollTop=0}
 else if(a==='settings'){sub='settings';render();$('#main').scrollTop=0}
 else if(a==='back'){sub=null;confirmWipe=false;render()}
 else if(a==='cm'){calOff=Math.min(0,calOff+Number(v));calSel=null;render()}
 else if(a==='cd'){calSel=calSel===+v?null:+v;render()}
 else if(a==='aok'){anim=AQ.shift()||null;ovl()}
 else if(a==='fold'){S['fold_'+v]=!(S['fold_'+v]===true);save();render()}
 else if(a==='stats'){stO=0;stSub=null;sub='stats';render();$('#main').scrollTop=0}
 else if(a==='statp'){stP=v;stO=0;stSub=null;render()}
 else if(a==='staton'){stO=Math.min(0,stO+Number(v));render()}
 else if(a==='statsub'){stSub=(!v||stSub===v)?null:v;render()}
 else if(a==='fv'){fv=v;render()}
 else if(a==='sharefile')shareFile();
 else if(a==='srm'){S.ph=null;save();render()}
 else if(a==='rph0'){S.run.ph=null;save();render()}
 else if(a==='start'){S.run={start:Date.now(),items:[]};ttl='';save();render()}
 else if(a==='add'){nm=nm===v?null:v;render();setTimeout(()=>{const x=$('#dn');if(x)x.focus()},0)}
 else if(a==='addn'){const n=($('#dn').value||'').trim();if(!n)return toast('Ponle nombre al cubata para puntuar');const c=S.cats.find(x=>x.id===v);if(!c)return;let s=c.subs.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!s){s={id:'u'+Date.now(),name:n};c.subs.push(s)}nm=null;save();toast('Cubata guardado: tócalo para puntuar');render()}
 else if(a==='adds'){const q=v.split('|');add(q[0],q[1])}
 else if(a==='undo'){S.run.items.pop();save();render()}
 else if(a==='discard'){S.run=null;ttl='';save();render()}
 else if(a==='finish'){const t=($('#ttl').value||'').trim();if(!t)return toast('Ponle un nombre a la sesión');const its=S.run.items;AQ=[];if(its.length){const rn0=S.run;S.run=null;const kb=stk().cur,b=ri(total());S.run=rn0;const ka=stk().cur,a=ri(total());S.sessions.push({id:'s'+Date.now(),title:t.slice(0,60),start:S.run.start,total:its.reduce((x,i)=>x+i.p,0),items:its,ph:S.run.ph||null});if(ka>kb)AQ.push({t:'s',p:kb,c:ka});if(a>b)AQ.push({t:'r',f:b,to:a});toast('Sesión guardada')}S.run=null;ttl='';save();anim=AQ.shift()||null;render()}
 else if(a==='addsub'){const c=S.cats.find(x=>x.id===$('#mc').value),n=$('#mn').value.trim();if(!c||!n)return toast('Ponle un nombre al cubata');c.subs.push({id:'u'+Date.now(),name:n.slice(0,40)});save();render()}
 else if(a==='delsub'){const q=v.split('|'),c=S.cats.find(x=>x.id===q[0]);if(c)c.subs=c.subs.filter(s=>s.id!==q[1]);save();render()}
 else if(a==='copy'){const t=code();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Código copiado'),()=>{$('#mycode').select()});else $('#mycode').select()}
 else if(a==='addf'){const t=($('#fc').value||'').trim().replace(/\s+/g,'').replace(/^.*?BEBE:/,'BEBE:');let o=null;try{o=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))))}catch(x){}
  fcode='';importFriend(o);return;
  const f={p:String(o.p).slice(0,40),n:String(o.n).slice(0,30),b:String(o.b||'').slice(0,80),c:/^#[0-9a-fA-F]{3,8}$/.test(o.c)?o.c:'#888',t:+o.t||0,w:+o.w||0,s:+o.s||0};const i=S.friends.findIndex(x=>x.p===f.p);if(i>=0)S.friends[i]=f;else S.friends.push(f);fcode='';save();toast(f.n+' añadido');render()}
 else if(a==='rmf'){S.friends=S.friends.filter(f=>f.p!==v);save();render()}
 else if(a==='theme'){S.theme=v;save();render()}
 else if(a==='lose'){S.lose=v==='1';save();render()}
 else if(a==='wipe1'){confirmWipe=true;render()}else if(a==='wipe0'){confirmWipe=false;render()}
 else if(a==='wipe2'){try{localStorage.removeItem('beb:data')}catch(x){}S=null;sub=null;tab='drink';ob={name:'',bio:'',color:PAL[0]};confirmWipe=false;render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='obn'){ob.name=t.value;$('#obg').disabled=!t.value.trim()}if(t.id==='ttl')ttl=t.value;if(t.id==='obb')ob.bio=t.value;if(t.id==='fc')fcode=t.value});
document.addEventListener('change',e=>{const t=e.target,f0=t.files&&t.files[0];if(t.id==='sph'&&f0){readImg(f0,200,u=>{S.ph=u;save();render()});return}if(t.id==='rph'&&f0&&S.run){readImg(f0,420,u=>{S.run.ph=u;save();render()});return}if(t.id==='fimp'&&f0){importFile(f0);return}if(e.target.id==='sb'){S.bio=e.target.value.trim().slice(0,80);save();return}if(e.target.id==='sn'){const n=e.target.value.trim();if(n){S.name=n;save()}else{e.target.value=S.name}}});
render();
</script></body></html>
